
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MINI POS - Sistem Kasir</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    body {
      background: #f3f6fb;
      font-family: Arial, sans-serif;
    }
    .navbar {
      background: #173b70;
    }
    .metric {
      border: none;
      border-radius: 15px;
      box-shadow: 0 3px 12px #00000012;
    }
    .product-card {
      border: none;
      border-radius: 14px;
      box-shadow: 0 3px 12px #00000010;
    }
    .price {
      color: #1769aa;
      font-weight: bold;
    }
    .receipt {
      background: white;
      padding: 20px;
      border: 1px dashed #777;
    }
    @media print {
      body * { visibility: hidden; }
      #receipt, #receipt * { visibility: visible; }
      #receipt {
        position: absolute;
        left: 0;
        top: 0;
        width: 100%;
      }
    }
  </style>
</head>

<body>

<nav class="navbar navbar-dark p-3">
  <div class="container">
    <span class="navbar-brand fw-bold">MINI POS</span>
    <span class="text-white">Sistem Kasir Digital</span>
  </div>
</nav>

<div class="container py-4">

  <h3 class="fw-bold mb-3">Dashboard Kasir</h3>

  <div class="row g-3 mb-4">
    <div class="col-md-4">
      <div class="card metric p-3">
        <small>Total Omzet</small>
        <h4 id="omzet">Rp 0</h4>
      </div>
    </div>
    <div class="col-md-4">
      <div class="card metric p-3">
        <small>Total Stok</small>
        <h4 id="totalStok">0</h4>
      </div>
    </div>
    <div class="col-md-4">
      <div class="card metric p-3">
        <small>Jumlah Transaksi</small>
        <h4 id="transaksi">0</h4>
      </div>
    </div>
  </div>

  <div class="row g-4">

    <div class="col-lg-7">
      <div class="card p-3">
        <h5>Tambah Produk</h5>

        <form id="formProduk">
          <input id="nama" class="form-control mb-2"
            placeholder="Nama produk" required>

          <input id="harga" type="number" min="1"
            class="form-control mb-2"
            placeholder="Harga produk" required>

          <input id="stok" type="number" min="0"
            class="form-control mb-3"
            placeholder="Jumlah stok" required>

          <button class="btn btn-primary w-100">
            Tambah Produk
          </button>
        </form>
      </div>

      <h5 class="mt-4">Daftar Produk</h5>
      <div id="daftarProduk" class="row g-3"></div>
    </div>

    <div class="col-lg-5">
      <div class="card p-3">
        <h5>Keranjang Belanja</h5>
        <div id="keranjang"></div>

        <hr>

        <h5>Total: <span id="total">Rp 0</span></h5>

        <label class="mt-2">Metode Pembayaran</label>
        <select id="metode" class="form-select mb-2">
          <option value="Tunai">Tunai</option>
          <option value="QRIS">QRIS</option>
          <option value="Transfer Bank">Transfer Bank</option>
        </select>

        <input id="uang" type="number" min="0"
          class="form-control mb-2"
          placeholder="Jumlah uang dibayar">

        <p>Kembalian: <b id="kembalian">Rp 0</b></p>

        <button id="bayar" class="btn btn-success w-100">
          Bayar Sekarang
        </button>
      </div>

      <div id="receipt" class="receipt mt-3" hidden>
        <h4 class="text-center">MINI POS</h4>
        <p class="text-center">Nota Pembelian</p>
        <hr>
        <div id="isiNota"></div>
      </div>

      <button onclick="window.print()"
        class="btn btn-dark w-100 mt-2">
        Cetak Nota
      </button>
    </div>

  </div>
</div>

<script src="app.js"></script>
</body>
</html>
